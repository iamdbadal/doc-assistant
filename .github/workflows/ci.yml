# =============================================================================
# GitHub Actions - Continuous Integration (CI)
#
# This workflow runs on every push and pull request.
#
# It performs the following checks:
#   1. Checkout the repository
#   2. Install Python
#   3. Install uv (modern Python package manager)
#   4. Sync project dependencies
#   5. Check code formatting (Black)
#   6. Run Ruff linter
#   7. Run MyPy type checker
#   8. Run Pytest unit tests
#
# Documentation:
# https://docs.github.com/actions
# https://docs.astral.sh/uv/
# =============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  quality-checks:
    name: Code Quality & Tests

    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Setup Python
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # Install uv
      # -----------------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # -----------------------------------------------------------------------
      # Cache uv downloads for faster builds
      # -----------------------------------------------------------------------
      - name: Enable uv Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # -----------------------------------------------------------------------
      # Install project dependencies
      # -----------------------------------------------------------------------
      - name: Install Dependencies
        run: uv sync --all-extras --dev

      # -----------------------------------------------------------------------
      # Check code formatting
      # -----------------------------------------------------------------------
      - name: Black Formatting Check
        run: uv run black --check .

      # -----------------------------------------------------------------------
      # Run Ruff linter
      # -----------------------------------------------------------------------
      - name: Ruff Lint
        run: uv run ruff check .

      # -----------------------------------------------------------------------
      # Run MyPy type checking
      # -----------------------------------------------------------------------
      - name: MyPy Type Check
        run: uv run mypy .

      # -----------------------------------------------------------------------
      # Run unit tests
      # -----------------------------------------------------------------------
      - name: Run Pytest
        run: uv run pytest