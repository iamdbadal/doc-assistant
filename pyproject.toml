[project]
name = "doc-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=2.52.0",
    "pinecone>=9.1.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
    "uvicorn>=0.52.1",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.32",
    "alembic>=1.19.1",
    "pwdlib[argon2]>=0.3.0",
    "minio>=7.2.20",
    "pymupdf>=1.28.2",
    "langdetect>=1.0.9",
    "langchain-text-splitters>=1.1.2",
    "tiktoken>=0.13.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "cohere>=7.0.8",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "isort==5.13.2",
    "mypy==1.17.1",
    "pre-commit>=4.6.1",
    "pytest==9.1.1",
    "ruff==0.12.8",
    "types-python-jose",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
mypy_path = "services/api"
explicit_package_bases = true
files = ["services/api/app"]

[tool.pytest.ini_options]
pythonpath = "services/api"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.isort]
profile = "black"
