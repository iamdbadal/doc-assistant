[project]
name = "doc-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=2.52.0",
    "pinecone>=9.1.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "isort==5.13.2",
    "mypy==1.17.1",
    "pytest==9.1.1",
    "ruff==0.12.8",
]
